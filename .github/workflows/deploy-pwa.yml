name: Deploy PWA

on:
  push:
    branches:
      - main
      - layout3_mobile2
  pull_request:
    branches:
      - main
      - layout3_mobile2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      - name: Run tests
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build PWA
        run: npm run build:web
      - name: Prepare GitHub Pages routes
        run: |
          test -f dist/index.html
          cp dist/index.html dist/404.html
          for route in settings instructions; do
            if [ -f "dist/${route}.html" ]; then
              mkdir -p "dist/${route}"
              cp "dist/${route}.html" "dist/${route}/index.html"
            fi
          done
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
